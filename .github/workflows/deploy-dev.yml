name: Deploy Function App (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-leadsphere-prospecting-function-dev
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: leadsphere-prospecting-function-dev
  AZURE_FUNCTIONAPP_PROJECT_PATH: LeadSphere.Discovery.Function
  DOTNET_VERSION: 10.0.x
  BUILD_ARTIFACT_NAME: released-package

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish function app
        run: dotnet publish --configuration Release --output ./output

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}/output
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}/downloaded-artifact

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}/downloaded-artifact
          sku: flexconsumption
